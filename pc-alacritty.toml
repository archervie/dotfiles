[general]
live_config_reload = true
ipc_socket = true

[colors.primary]
background = "#16161A"
foreground = "#ffffff"

[colors.normal]
black = "#16161A"
green = "#75FF95"
red = "#dd5682"
yellow = "#FFE169"
blue = "#69DAFF"
magenta = "#EB91FF"
cyan = "#69FFF7"
white = "#ffffff"

[cursor]
style = { shape = "Block", blinking = "On" }
blink_interval = 500
blink_timeout = 5

[font]
size = 12.0

[font.normal]
family = "Terminus (TTF)"
style = "Regular"

[keyboard]
bindings = [
  { key = "N", mods = "Control|Shift", action = "CreateNewWindow" },
  { key = "V", mods = "Control|Shift", action = "Paste" },
  { key = "C", mods = "Control|Shift", action = "Copy" },
]

[selection]
save_to_clipboard = true

[window]
decorations = "Full"
padding = { x = 10, y = 10 }
opacity = 1.0